<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>form practice</title>
        <link rel="stylesheet" href="arithamaticform.css">
    </head>
    <body>
        <form class="form" id="userform">
            <p>enter 2 numbers to perform  arithamatic operations</p>
            <input type="number" id="num1" placeholder="enter first number"> <br>
            <input type="number" id="num2" placeholder="enter second number"> <br>
            <button type="button" id="addBtn">Add</button>
            <button type="button" id="subBtn">Subtract</button>
            <button type="button" id="multiplyBtn">Multiply</button>
            <button type="button" id="divideBtn">Divide</button>
            <h2 id="result"></h2>

        </form>
        <script src="arithamaticform.js"></script>
    </body>
    </html>
