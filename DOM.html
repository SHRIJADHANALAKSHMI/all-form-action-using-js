<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>DOM Practice</title>

    <link rel="stylesheet"
    href="DOM.css">

</head>

<body>
    <h1 id="title">
        Welcome to DOM Practice
    </h1>
    <button id="textBtn">
        Change Text
    </button>

    <hr>

    <button id="colorBtn">
        Change Color
    </button>

    <hr>

    <input type="text"
    id="nameInput"
    placeholder="Enter your name">

    <button id="showBtn">
        Show Name
    </button>

    <h2 id="output"></h2>

    <button id="addBtn">
        Add Paragraph 
    </button>

    <div id="paragraphContainer"> the original paragraph 

    </div>

    <hr>
    <p id="removeText">
        This text will be removed
    </p>

    <button id="removeBtn">
        Remove Text
    </button>

    <hr>

    <script src="DOM.js"></script>

</body>

</html>
